<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--h:68px;--deep:#3D0A5C;--v:#6F1D9B;--b:#9333C9;--soft:#F1E6F8;--line:#D9C3E8;--muted:#5E4D70;--ink:#1B0B26;--teal:#0B3A3F;--or:#F08A1C;--pink:#E5384F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(#6f1d9b14 1px,transparent 1px) 0 0/24px 24px,#ECEAEE}
#app{flex:1}h1,h2,h3{font-family:'Fredoka',sans-serif}
header{height:var(--h);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1200}
header .logo{font:700 1.15rem 'Fredoka';color:var(--v);text-decoration:none;white-space:nowrap}
nav{display:flex;align-items:center;gap:2px;background:var(--v);padding:5px;border-radius:99px;box-shadow:0 8px 20px #6f1d9b40}
nav a,nav button{color:#fff;text-decoration:none;font:600 .85rem 'Space Grotesk';background:none;border:0;padding:9px 14px;border-radius:99px;cursor:pointer}
nav a:hover,nav button:hover{background:#ffffff2b}
main{max-width:640px;margin:0 auto;padding:22px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:99px;border:2px solid var(--v);background:#fff;color:var(--v);font:700 .95rem 'Space Grotesk';cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:var(--v);color:#fff;box-shadow:0 10px 24px #6f1d9b55}.btn.o{background:var(--or);border-color:var(--or);color:#1B0B26;box-shadow:0 10px 24px #f08a1c66}
.btn.d{background:var(--pink);border-color:var(--pink);color:#fff}.btn:disabled{opacity:.5}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px;box-shadow:0 6px 18px #3d0a5c14}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
input,select{width:100%;min-height:48px;border:2px solid var(--line);border-radius:14px;padding:0 12px;margin-top:8px;font:inherit;background:#fff}input:focus,select:focus{outline:0;border-color:var(--b)}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:700}
.live{background:#16a34a;color:#fff}.delayed{background:var(--or);color:#1B0B26}.offline{background:#e2e0e6;color:#3b3345}.disabled{background:var(--pink);color:#fff}
.muted{color:var(--muted);font-size:.85rem}.err{background:#fde8ec;color:#a3132b;padding:10px;border-radius:12px;margin-top:12px;font-size:.9rem}
.trk{display:flex;flex-direction:column;height:calc(100dvh - var(--h))}#map{flex:1;min-height:0}
#panel{max-height:48%;overflow:auto;padding:14px 16px;border-radius:26px 26px 0 0;box-shadow:0 -6px 20px #3d0a5c33;background:#fff}
.st{display:flex;justify-content:space-between;padding:9px 12px;border-radius:12px;font-size:.88rem}
.st.n{background:var(--v);color:#fff;font-weight:700}.st.x{color:#9a90a6}
.bus-pin,.stop-pin{display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #0006;color:#fff;font-weight:700}
.bus-pin{background:var(--v);width:42px;height:42px;font-size:21px}.stop-pin{background:var(--or);color:#1B0B26;width:26px;height:26px;font-size:12px}
.demo{position:absolute;top:10px;left:10px;z-index:999;background:var(--teal);color:#fff;padding:5px 12px;border-radius:99px;font-weight:700;font-size:.8rem}
.warn{background:var(--or);color:#1B0B26;padding:10px;text-align:center;font-size:.85rem;font-weight:600}
.hero{text-align:center;padding:34px 16px 6px;max-width:920px;margin:0 auto}
.eyebrow{display:inline-block;font:700 .78rem 'Space Grotesk';letter-spacing:.06em;color:var(--teal);background:#fff;border:1px solid var(--line);padding:7px 15px;border-radius:99px}
.slider{overflow:hidden;margin-top:16px}.sl{display:flex;transition:transform .7s cubic-bezier(.65,0,.35,1)}
.slide{min-width:100%;padding:8px 10px}.slide .em{font-size:4.2rem;display:inline-block;animation:bob 3s ease-in-out infinite}
.slide h1{font-size:clamp(2.5rem,9vw,4.6rem);line-height:1;color:var(--v);margin:6px 0 12px;letter-spacing:-.02em}
.slide p{font-size:1.1rem;color:var(--ink);max-width:520px;margin:0 auto}
@keyframes bob{50%{transform:translateY(-10px)}}
.dots{display:flex;justify-content:center;gap:8px;margin:18px 0}.dots i{width:10px;height:10px;border-radius:99px;background:var(--line);cursor:pointer;transition:.3s}.dots i.on{width:34px;background:var(--or)}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;max-width:920px;margin:30px auto 0;padding:0 16px}
.how div{background:var(--v);color:#fff;border-radius:24px;padding:20px;font-weight:600;transition:transform .2s}.how div:hover{transform:translateY(-5px) rotate(-1deg)}
.how b{display:block;font:700 2.2rem 'Fredoka';color:var(--or)}
.chips{display:flex;gap:10px;overflow-x:auto;max-width:920px;margin:22px auto 0;padding:4px 16px 8px}
.chips a{white-space:nowrap;text-decoration:none;background:#fff;color:var(--deep);font-weight:700;padding:11px 18px;border-radius:99px;border:2px solid var(--line)}.chips a:hover{background:var(--v);color:#fff;border-color:var(--v)}
footer{max-width:520px;width:calc(100% - 32px);margin:30px auto 0;padding:16px 0 20px;text-align:center;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}footer b{color:var(--v);font-family:'Fredoka';font-size:1rem;letter-spacing:.02em}

#panel{max-height:none;box-shadow:none;border-radius:0;background:none;padding:16px 14px;overflow:auto}
#sheet{position:relative;background:linear-gradient(#f6ecfb,#fff);border-radius:28px 28px 0 0;box-shadow:0 -8px 24px #3d0a5c33;max-height:54%;display:flex;flex-direction:column}
.demo{top:auto;bottom:14px}
.hud{position:absolute;top:12px;left:14px;z-index:1000;pointer-events:none}
.hud b{display:block;font:700 4.2rem/1 'Fredoka';color:var(--v);text-shadow:0 2px 0 #fff,0 0 14px #fff,0 0 14px #fff}
.hud span{display:inline-block;font-weight:700;background:#fff;border-radius:99px;padding:3px 11px;font-size:.8rem;box-shadow:0 2px 8px #0002}
.fab{position:absolute;top:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:10px}
.fb{width:46px;height:46px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 14px #3d0a5c40;font-size:1.1rem;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--v);cursor:pointer}.fb.x{color:var(--pink);font-weight:800}
.arr{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1000;background:#fff;border-radius:20px;padding:6px 16px;text-align:center;font:700 .62rem 'Space Grotesk';letter-spacing:.06em;color:var(--muted);box-shadow:0 4px 14px #3d0a5c40}
.arr b{display:block;font:700 1.4rem 'Fredoka';color:var(--ink);letter-spacing:0}.arr:empty{display:none}
.go{position:absolute;right:16px;top:-32px;z-index:5;background:linear-gradient(135deg,var(--b),var(--deep));color:#fff;border:0;border-radius:22px;padding:12px 24px;font:italic 800 1.8rem 'Fredoka';box-shadow:0 8px 20px #6f1d9b66;cursor:pointer}
.cards{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px}
.mc{min-width:106px;flex:none;background:#fff;border-radius:22px;padding:12px 8px;text-align:center;box-shadow:0 6px 18px #3d0a5c1f}
.mc b{display:block;font:700 2.9rem/1 'Fredoka';color:var(--deep)}.mc small{display:block;font-size:.78rem;color:var(--muted)}
.mc em{display:block;font:600 .7rem 'Space Grotesk';font-style:normal;margin-top:6px;color:var(--muted);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc.on{background:linear-gradient(160deg,var(--b),var(--deep));border-radius:22px 22px 30px 30px}.mc.on b,.mc.on small,.mc.on em{color:#fff}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.chip{background:var(--soft);color:var(--deep);font-weight:700;font-size:.8rem;padding:6px 12px;border-radius:12px}
.list{position:relative;padding-left:28px;margin-top:6px}
.list:before{content:'';position:absolute;left:9px;top:12px;bottom:12px;width:8px;border-radius:8px;background:linear-gradient(var(--b),var(--deep))}
.sr{position:relative;display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #eee;font-weight:700}
.sr i{position:absolute;left:-25px;top:50%;margin-top:-7px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--deep)}
.sr em{font-style:normal;color:var(--muted);font-weight:600;white-space:nowrap}.sr.x{color:#a99bb8}.sr.x i{border-color:#cdbfdc}
.sr.n{color:var(--v)}.sr.n i{background:var(--or);border-color:#fff;box-shadow:0 0 0 3px var(--or)}
.num{width:58px;height:58px;border-radius:18px;background:var(--v);color:#fff;font:700 1.8rem 'Fredoka';display:flex;align-items:center;justify-content:center;flex:none}

.isc{font:700 .8rem 'Space Grotesk';color:var(--v);background:var(--soft);padding:6px 12px;border-radius:99px;white-space:nowrap}
.hc{display:inline-block;margin-left:6px;font:700 .8rem 'Space Grotesk';background:var(--deep);color:#fff;border-radius:99px;padding:3px 10px}
.stop-pin.s{background:#16a34a;color:#fff;width:32px;height:32px;font-size:14px}.stop-pin.e{background:var(--deep);color:#fff;width:32px;height:32px;font-size:15px}
.dirs{display:flex;gap:8px;margin-bottom:10px}.dirs button{flex:1;min-height:42px;border-radius:14px;border:2px solid var(--line);background:#fff;font:700 .85rem 'Space Grotesk';color:var(--muted);cursor:pointer}.dirs button.on{background:var(--v);border-color:var(--v);color:#fff}
.note{background:#fff7e6;border:1px solid var(--or);color:#6b3d00;border-radius:14px;padding:10px 12px;font-weight:600;font-size:.9rem;margin-bottom:10px}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--or));transition:width .6s}
.sr .sn{display:flex;flex-direction:column;gap:2px;flex:1}.sr .sn small{font-weight:500;color:var(--muted);font-size:.74rem;line-height:1.35}
.stc{align-self:center;font:700 .68rem 'Space Grotesk';padding:4px 9px;border-radius:99px;white-space:nowrap}
.stc.sch{background:#ece8f1;color:#4b3f5a}.stc.app{background:var(--or);color:#1B0B26}.stc.arr{background:#16a34a;color:#fff}.stc.dep{background:var(--v);color:#fff}.stc.del{background:var(--pink);color:#fff}.stc.na{background:#d9d4df;color:#3b3345}
.tag{font-weight:700;font-size:.66rem;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--deep)}.tag.m{background:#ffe9c7;color:#7a4300}
@media(min-width:900px){.trk{flex-direction:row}#sheet{width:430px;max-height:none;border-radius:0;box-shadow:-8px 0 24px #3d0a5c26}.go{top:14px;right:auto;left:-96px}}
@media(max-width:560px){.isc{display:none}}
.logo{display:flex;align-items:center;gap:10px}.logo img{height:42px;width:auto;display:block}.logo span{font:700 1rem 'Fredoka';color:var(--v);border-left:2px solid var(--line);padding-left:10px;white-space:nowrap}
.herologo{display:block;margin:0 auto 14px;height:auto;width:min(300px,70%)}
@media(max-width:420px){.logo span{display:none}.logo img{height:36px}}

/* Exclusivity lock & live sharing additions */
.badge.locked{background:#fde8ec;color:#a3132b;border:1px solid #f87171}
.badge.shared-you{background:#ecfdf5;color:#047857;border:1px solid #34d399}
.card-locked{border:2px solid var(--pink);background:#fff5f7;border-radius:20px;padding:16px;margin-top:12px}
.card-avail{border:2px solid #16a34a;background:#f0fdf4;border-radius:20px;padding:16px;margin-top:12px}
.pulse-dot{width:10px;height:10px;border-radius:50%;background:#16a34a;display:inline-block;animation:pulse-anim 1.5s infinite}
@keyframes pulse-anim{0%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(22,163,74,0.7)}70%{transform:scale(1.1);box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat-box small{color:var(--muted);font-size:0.75rem;font-weight:600;text-transform:uppercase}
.stat-box b{font-size:1.1rem;color:var(--ink);display:block;margin-top:2px}

</style>

let buses = [], locs = {}, stopsCache = {}, map, liveChannel, tick, watchId, demoTimer, sharing = null;
let busesLoadError = '';
let routeVersion = 0, activeRouteHash = location.hash;

function isCurrentRoute(version) {
  return version === routeVersion && activeRouteHash === location.hash;
}

const rn = b => (b.name.match(/\d+/) || ['🚌'])[0];
const esc = t => String(t || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm = ms => new Date(ms).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit', hour12: true });

const dist = (a, b) => {
  const r = Math.PI / 180, dl = (b.lat - a.lat) * r, dn = (b.lng - a.lng) * r;
  const h = Math.sin(dl / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dn / 2) ** 2;
  return 12742000 * Math.asin(Math.sqrt(h));
};

const pin = (h, c, s) => L.divIcon({ html: h, className: c + ' ', iconSize: [s, s], iconAnchor: [s / 2, s / 2] });
const fmt = s => s < 60 ? 'Arriving now' : (m => m < 60 ? m + ' min' : (m / 60 | 0) + ' h ' + m % 60 + ' min')(Math.round(s / 60));

// Age in seconds of last location update
const ageSec = iso => iso ? Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000) : Infinity;

const ago = iso => {
  const s = ageSec(iso);
  if (s === Infinity) return 'never';
  if (s < 5) return 'just now';
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  return `${Math.floor(s / 3600)} h ago`;
};

// Check if a bus is actively locked by someone else
function isBusLockedByOther(busId) {
  const l = locs[busId];
  if (!l || !l.sharing) return false;
  const s = ageSec(l.updated_at);
  // Active within 60s and broadcaster is not this device
  if (s < 60 && l.shared_by && l.shared_by !== myDeviceId) {
    return {
      locked: true,
      ageSec: Math.floor(s),
      sharedBy: l.shared_by,
      isDemo: !!l.is_demo
    };
  }
  return false;
}

// Status calculation
const status = (b, l) => {
  if (!b.is_active) return ['disabled', '⛔ Disabled'];
  if (!l || !l.sharing) return ['offline', '⚪ OFFLINE'];
  const s = ageSec(l.updated_at);
  if (s > 60) return ['offline', '⚪ OFFLINE'];
  if (s > 25) return ['delayed', '🟠 DELAYED'];
  return ['live', '🟢 LIVE'];
};

const badge = (b, l) => {
  const [c, t] = status(b, l);
  const lock = isBusLockedByOther(b.id);
  if (c === 'live') {
    if (lock) return `<span class="badge live">🟢 LIVE (In Use)</span>`;
    if (l.shared_by === myDeviceId) return `<span class="badge shared-you">🟢 LIVE (You)</span>`;
  }
  return `<span class="badge ${c}">${t}</span>`;
};

function cleanup() {
  if (map) { map.remove(); map = null; }
  clearInterval(tick);
  tick = null;
  window.onRealtimeTick = null;
}

// Load buses and locations from database
async function loadBuses() {
  busesLoadError = '';
  try {
    const { data: bList, error: bError } = await sb.from('buses').select('*').order('id');
    if (bError) {
      buses = [];
      busesLoadError = bError.message || 'Supabase rejected the buses query.';
      console.error('Error loading buses:', bError);
      return;
    }
    buses = Array.isArray(bList) ? bList : [];
    const { data: lList, error: lError } = await sb.from('bus_locations').select('*');
    if (lError) console.warn('Could not load bus locations:', lError);
    if (lList) {
      locs = Object.fromEntries(lList.map(r => [r.bus_id, r]));
    }
  } catch (e) {
    buses = [];
    busesLoadError = e && e.message ? e.message : String(e);
    console.error('Error loading buses:', e);
  }
}

// Realtime setup with WebSocket Broadcast for zero-latency peer updates
function setupRealtime() {
  if (liveChannel) sb.removeChannel(liveChannel);
  liveChannel = sb.channel('college-bus-live-tracker', {
    config: { broadcast: { ack: false } }
  })
    .on('broadcast', { event: 'loc_update' }, ({ payload }) => {
      if (payload && payload.bus_id) {
        locs[payload.bus_id] = {
          ...locs[payload.bus_id],
          ...payload
        };
        if (typeof window.onRealtimeTick === 'function') {
          window.onRealtimeTick(payload.bus_id);
        }
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'bus_locations' }, (payload) => {
      if (payload.new && payload.new.bus_id) {
        locs[payload.new.bus_id] = payload.new;
        if (typeof window.onRealtimeTick === 'function') {
          window.onRealtimeTick(payload.new.bus_id);
        }
      }
    })
    .subscribe();
}

let rlsWarnShown = false;
function showRlsNotice() {
  if (rlsWarnShown) return;
  rlsWarnShown = true;
  const w = document.getElementById('warn');
  if (w) {
    w.innerHTML = `
      <div class="warn" style="background:#FEF3C7;color:#92400E;text-align:left;padding:12px 16px;font-size:0.85rem;border-bottom:1px solid #F59E0B;">
        <b>💡 Supabase Public Permission Notice:</b> Location broadcast is streaming live via WebSockets. To also persist locations to database without login, run this in Supabase SQL editor:
        <code style="display:block;background:#fff;padding:6px 10px;border-radius:6px;margin:6px 0;font-family:monospace;color:#B45309;">ALTER TABLE bus_locations DISABLE ROW LEVEL SECURITY;</code>

}

// Push location (WebSocket Broadcast + Database Upsert)
async function push(busId, lat, lng, acc, speed, isDemo) {
  const nowIso = new Date().toISOString();
  const payload = {
    bus_id: +busId,
    latitude: lat,
    longitude: lng,
    accuracy: acc,
    speed: speed || 0,
    sharing: true,
    is_demo: isDemo,
    shared_by: myDeviceId,
    updated_at: nowIso
  };

  // Update local memory
  locs[busId] = payload;

  // 1. Broadcast over WebSocket (instant, works across all browsers)
  if (liveChannel) {
    liveChannel.send({
      type: 'broadcast',
      event: 'loc_update',
      payload
    });
  }

  // 2. Persist to Supabase bus_locations table
  try {
    const { error } = await sb.from('bus_locations').upsert({
      bus_id: +busId,
      latitude: lat,
      longitude: lng,
      accuracy: acc,
      sharing: true,
      is_demo: isDemo,
      shared_by: myDeviceId,
      updated_at: nowIso
    }, { onConflict: 'bus_id' });
    if (error && error.code === '42501') {
      showRlsNotice();
    }
  } catch (e) {
    console.warn('DB upsert notice:', e);
  }

  // Update live stats on Share page if active
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('la', lat.toFixed(6));
  set('lo', lng.toFixed(6));
  set('ls', 'just now');
  set('sp', speed ? Math.round(speed) + ' km/h' : '—');
  set('ac', acc ? '±' + Math.round(acc) + ' m' : '—');
}

// Stop sharing (releases exclusivity lock)
async function stopShare() {
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  const s = sharing;
  sharing = null;

  if (s) {
    const nowIso = new Date().toISOString();
    const payload = {
      bus_id: +s.id,
      latitude: s.lastLat || 0,
      longitude: s.lastLng || 0,
      accuracy: null,
      speed: 0,
      sharing: false,
      is_demo: false,
      shared_by: myDeviceId,
      updated_at: nowIso
    };
    locs[s.id] = payload;
    if (liveChannel) {
      liveChannel.send({
        type: 'broadcast',
        event: 'loc_update',
        payload
      });
    }
    try {
      await sb.from('bus_locations').update({ sharing: false, updated_at: nowIso }).eq('bus_id', +s.id);
    } catch (e) {}
  }
  if (location.hash === '#/share') share();
}

const showErr = m => { const e = document.getElementById('se'); if (e) e.innerHTML = m ? `<div class="err">${esc(m)}</div>` : ''; };

// Start sharing (GPS or Demo)
async function start(id, demo) {
  if (!id) return showErr('Please select a bus first.');
  const b = buses.find(x => x.id == id);
  if (!b) return showErr('Bus not found.');

  // Exclusivity Check before starting:
  const lock = isBusLockedByOther(id);
  if (lock) {
    return showErr(`Cannot share this bus: Another user is actively broadcasting location for ${b.name} (${lock.ageSec}s ago). Only one person can share at a time.`);
  }

  // Fetch stops for ETA / Demo
  if (!stopsCache[id]) {
    const { data: st } = await sb.from('bus_stops').select('*').eq('bus_id', id).order('stop_order');
    stopsCache[id] = st || [];
  }
  const st = stopsCache[id];
  if (demo && (!st || st.length < 2)) {
    return showErr('Demo mode needs at least 2 stops for this bus.');
  }

  sharing = {
    id: +id,
    name: b.name,
    routeName: b.route_name,
    demo: !!demo,
    stops: st,
    startedAt: Date.now(),
    lastLat: null,
    lastLng: null
  };

  await share(); // re-render share dashboard

  if (demo) {
    // Simulated route progression
    const path = [];
    for (let i = 0; i < st.length - 1; i++) {
      for (let k = 0; k < 25; k++) {
        const t = k / 25;
        path.push({
          lat: st[i].latitude + (st[i + 1].latitude - st[i].latitude) * t,
          lng: st[i].longitude + (st[i + 1].longitude - st[i].longitude) * t
        });
      }
    }
    let idx = 0;
    const p0 = path[0];
    sharing.lastLat = p0.lat; sharing.lastLng = p0.lng;
    push(id, p0.lat, p0.lng, 5, 25, true);

    demoTimer = setInterval(() => {
      idx = (idx + 1) % path.length;
      const pt = path[idx];
      if (sharing) {
        sharing.lastLat = pt.lat; sharing.lastLng = pt.lng;
      }
      push(id, pt.lat, pt.lng, 5, 25 + Math.round(Math.random() * 8), true);
    }, 2000);
  } else {
    // Real GPS Watcher
    if (!navigator.geolocation) {
      sharing = null;
      await share();
      return showErr('This browser does not support GPS.');
    }
    let lastSent = 0;
    let prevPos = null;

    watchId = navigator.geolocation.watchPosition(
      pos => {
        const { latitude, longitude, accuracy, speed } = pos.coords;
        let speedKmh = 0;
        if (speed != null && speed > 0) {
          speedKmh = speed * 3.6;
        } else if (prevPos && pos.timestamp > prevPos.timestamp) {
          const d = dist({ lat: prevPos.coords.latitude, lng: prevPos.coords.longitude }, { lat: latitude, lng: longitude });
          const dt = (pos.timestamp - prevPos.timestamp) / 1000;
          if (dt > 1) speedKmh = (d / dt) * 3.6;
        }
        prevPos = pos;

        if (Date.now() - lastSent < 2500) return; // throttle to every 2.5s
        lastSent = Date.now();

        if (sharing) {
          sharing.lastLat = latitude; sharing.lastLng = longitude;
        }
        push(id, latitude, longitude, accuracy, Math.round(speedKmh), false);
      },
      err => {
        const msg = err.code === 1 ? 'Location permission was denied. Please allow location access in your browser settings.'
                  : err.code === 2 ? 'GPS is unavailable right now. Check device location is turned on.'
                  : 'Getting location timed out. Try again in an open area.';
        showErr(msg);
        if (err.code === 1) stopShare();
      },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
    );
  }
}

/* ---------- 2. BUS LIST PAGE ---------- */
async function busList(routeId = routeVersion) {
  app.innerHTML = '<main><h2>Available Buses</h2><p class="muted" id="bl">Loading buses…</p></main>';
  await loadBuses();
  if (!isCurrentRoute(routeId)) return;
  const draw = () => {
    const m = app.querySelector('main');
    if (!m) return;
    const emptyState = busesLoadError
      ? `<div class="err"><b>Couldn’t load buses from Supabase.</b><br>${esc(busesLoadError)}<br><br>Check the project URL and public key, and confirm the buses table allows reading.</div>`
      : '<p class="muted">No buses were returned by this Supabase project. Check that its buses table contains route rows.</p>';
    m.innerHTML = '<h2>Available Buses</h2>' + (buses.length ? buses.map(b => {
      const loc = locs[b.id];
      const isLocked = isBusLockedByOther(b.id);
      const isMyShare = loc && loc.sharing && loc.shared_by === myDeviceId;
      return `
        <div class="card row" style="align-items:flex-start">
          <div class="num">${rn(b)}</div>
          <div style="flex:1">
            <b>${esc(b.name.replace(/^Route \d+ - /, ''))}</b>
            <div class="muted">${esc(b.route_name)}</div>
            <div style="margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              ${badge(b, loc)}
              ${loc && loc.sharing && ageSec(loc.updated_at) < 60 ? `<span class="chip" style="font-size:0.75rem">⏱ ${ago(loc.updated_at)}</span>` : ''}
            </div>
            <div class="muted" style="font-size:0.8rem;margin-top:4px">
              ${isLocked ? `<span style="color:var(--pink);font-weight:600">🔒 Broadcasted live by another user</span>`
                : isMyShare ? `<span style="color:#047857;font-weight:600">🟢 You are currently sharing this bus</span>`
                : (loc && loc.sharing && ageSec(loc.updated_at) < 60 ? '🟢 Location active' : '⚪ Offline')}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <a class="btn p" href="#/track/${b.id}">Track</a>
            ${!isLocked && !isMyShare ? `<a class="btn" style="min-height:36px;padding:0 14px;font-size:0.8rem;" href="#/share?bus=${b.id}">Share</a>` : ''}
          </div>
        </div>
      `;
    }).join('') : emptyState);
  };
  draw();
  tick = setInterval(draw, 1500);
  window.onRealtimeTick = () => draw();
}

/* ---------- 3. TRACK LIVE MAP PAGE ---------- */
async function track(id, routeId = routeVersion) {
  await loadBuses();
  if (!isCurrentRoute(routeId)) return;
  const b = buses.find(x => x.id == id);
  if (!b) {
    app.innerHTML = '<main><h2>Bus not found</h2><p class="muted">Route not found. <a href="#/buses">Back to buses</a></p></main>';
    return;
  }

  // Load stops
  if (!stopsCache[id]) {
    const { data: st } = await sb.from('bus_stops').select('*').eq('bus_id', id).order('stop_order');
    if (!isCurrentRoute(routeId)) return;
    stopsCache[id] = st || [];
  }
  const stops = stopsCache[id] || [];

  const rname = b.name.replace(/^Route \d+ - /, '');
  app.innerHTML = `
    <div class="trk">
      <div id="mw" style="position:relative;flex:1;min-height:0">
        <div id="map" style="position:absolute;inset:0"></div>
        <div class="hud">
          <b>${rn(b)}</b>
          <span>${esc(rname)}</span>
          <span class="hc" id="hc"></span>
        </div>
        <div class="fab">
          <a class="fb x" href="#/buses" title="Back">✕</a>
          <button class="fb" onclick="focusBus()" title="Focus on bus">➤</button>
        </div>
        <div class="arr" id="arr"></div>
      </div>
      <section id="sheet">
        <button class="go" onclick="focusBus()">GO</button>
        <div id="panel"></div>
      </section>
    </div>
  `;

  map = L.map('map').setView([12.96, 80.2], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
  const routeLayer = L.layerGroup().addTo(map);

  let marker = null;
  let kmh = 25;

  window.focusBus = () => {
    if (marker) map.setView(marker.getLatLng(), 16);
    else if (stops.length) map.fitBounds(stops.map(s => [s.latitude, s.longitude]), { padding: [40, 40] });
  };

  // Draw route polyline and stop pins
  const pts = stops.map(s => [s.latitude, s.longitude]);
  stops.forEach((s, i) => {
    const isFirst = i === 0;
    const isLast = i === stops.length - 1;
    const pinLabel = isFirst ? 'S' : isLast ? '🏁' : String(s.stop_order);
    const pinClass = 'stop-pin ' + (isFirst ? 's' : isLast ? 'e' : '');
    L.marker([s.latitude, s.longitude], {
      icon: pin(pinLabel, pinClass, isFirst || isLast ? 32 : 26)
    }).bindPopup(`<b>${esc(s.stop_name)}</b><br>Stop #${s.stop_order}`).addTo(routeLayer);
  });
  if (pts.length > 1) {
    L.polyline(pts, { color: '#7C3AED', weight: 5, opacity: 0.85 }).addTo(routeLayer);
    map.fitBounds(pts, { padding: [40, 40] });
  }

  // Calculate live ETAs
  function calculateEtas(p, speed) {
    if (!stops.length) return [];
    let nextIdx = 0, minDist = 1e12;
    stops.forEach((s, idx) => {
      const d = dist(p, { lat: s.latitude, lng: s.longitude });
      if (d < minDist) { minDist = d; nextIdx = idx; }
    });
    if (minDist >= 50 && nextIdx < stops.length - 1) {
      const a = stops[nextIdx], b = stops[nextIdx + 1];
      if ((b.longitude - a.longitude) * (p.lng - a.longitude) + (b.latitude - a.latitude) * (p.lat - a.latitude) > 0) {
        nextIdx = nextIdx + 1;
      }
    }
    let accDist = 0;
    const vMps = Math.max(speed, 10) / 3.6;
    return stops.map((s, idx) => {
      if (idx < nextIdx) return { stop: s, passed: true, next: false, sec: 0 };
      accDist = (idx === nextIdx) ? dist(p, { lat: s.latitude, lng: s.longitude }) : accDist + dist({ lat: stops[idx - 1].latitude, lng: stops[idx - 1].longitude }, { lat: s.latitude, lng: s.longitude });
      return {
        stop: s,
        passed: false,
        next: idx === nextIdx,
        sec: (accDist * 1.3) / vMps
      };
    });
  }

  const draw = () => {
    const l = locs[id];
    const [stClass] = status(b, l);
    const isLive = (stClass === 'live' || stClass === 'delayed');

    if (isLive && l) {
      const ll = [l.latitude, l.longitude];
      if (l.speed) kmh = l.speed;
      if (!marker) {
        marker = L.marker(ll, {
          icon: pin('🚌', 'bus-pin', 42),
          zIndexOffset: 1000
        }).bindTooltip(esc(b.name), { permanent: true, direction: 'top', offset: [0, -24] }).addTo(map);
        map.setView(ll, 15);
      } else {
        marker.setLatLng(ll);
      }
    } else if (marker) {
      marker.remove();
      marker = null;
    }

    const oldDemo = document.querySelector('.demo');
    if (oldDemo) oldDemo.remove();
    if (isLive && l && l.is_demo) {
      document.getElementById('mw').insertAdjacentHTML('beforeend', '<span class="demo">🟣 DEMO MODE · simulated location</span>');
    }

    const hc = document.getElementById('hc');
    if (hc) hc.textContent = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit', hour12: true });

    const panel = document.getElementById('panel');
    if (!panel) return;

    const E = isLive && l ? calculateEtas({ lat: l.latitude, lng: l.longitude }, kmh) : [];
    const upcoming = E.filter(e => !e.passed);
    const nextStop = upcoming[0];

    const arrEl = document.getElementById('arr');
    if (arrEl) {
      if (nextStop) {
        const arrTime = new Date(Date.now() + nextStop.sec * 1000).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit', hour12: true });
        arrEl.innerHTML = `NEXT STOP: ${esc(nextStop.stop.stop_name)}<b>ETA ${fmt(nextStop.sec)} (${arrTime})</b>`;
      } else {
        arrEl.innerHTML = '';
      }
    }

    const cards = upcoming.length ? upcoming.slice(0, 4).map((e, idx) => `
      <div class="mc ${idx === 0 ? 'on' : ''}">
        <b>${e.sec < 60 ? 'Now' : Math.round(e.sec / 60)}</b>
        <small>${e.sec < 60 ? 'Arriving' : 'min (est.)'}</small>
        <em>${esc(e.stop.stop_name)}</em>
      </div>
    `).join('') : `
      <div class="mc">
        <b>${isLive ? '✓' : '—'}</b>
        <small>${isLive ? 'Completed' : 'Offline'}</small>
        <em>${esc(isLive ? 'All stops passed' : 'Waiting for broadcast')}</em>
      </div>
    `;

    const rows = stops.map((s, idx) => {
      const e = E[idx];
      let tag = ['Scheduled', 'sch'];
      let sub = `Stop #${s.stop_order}`;
      if (isLive && e) {
        if (e.passed) {
          tag = ['Passed', 'dep'];
          sub = '✓ Bus has departed this stop';
        } else if (e.next) {
          tag = ['Approaching', 'app'];
          sub = `ETA in ${fmt(e.sec)}`;
        } else {
          tag = ['ETA ' + fmt(e.sec), 'sch'];
          sub = `Est. arrival in ${fmt(e.sec)}`;
        }
      }
      return `
        <div class="sr ${e && e.passed ? 'x' : ''} ${e && e.next ? 'n' : ''}">
          <i></i>
          <div class="sn">
            <span>${s.stop_order}. ${esc(s.stop_name)}</span>
            <small>${sub}</small>
          </div>
          <span class="stc ${tag[1]}">${tag[0]}</span>
        </div>
      `;
    }).join('');

    const passedCount = E.filter(e => e.passed).length;

    panel.innerHTML = `
      <div class="chips2">
        ${badge(b, l)}
        ${isLive ? `<span class="chip">⚡ ${Math.round(kmh)} km/h</span>` : ''}
        <span class="chip">⏱ GPS: ${l ? ago(l.updated_at) : 'Offline'}</span>
      </div>
      ${!isLive ? `
        <div class="note" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <span>⚪ Bus is currently offline. No one is broadcasting location.</span>
          <a class="btn p" style="min-height:36px;padding:0 14px;font-size:0.8rem;" href="#/share?bus=${b.id}">📡 Share Location</a>
        </div>
      ` : ''}
      <div class="cards">${cards}</div>
      ${stops.length && isLive ? `
        <div class="prog"><i style="width:${Math.round(passedCount / stops.length * 100)}%"></i></div>
        <p class="muted">${passedCount} of ${stops.length} stops reached</p>
      ` : ''}
      <div class="list">${rows}</div>
      <p class="muted" style="margin-top:10px">Live ETAs update smoothly in real time from GPS speed and coordinates.</p>
    `;
  };

  draw();
  tick = setInterval(draw, 1000);
  window.onRealtimeTick = (updatedBusId) => {
    if (updatedBusId === id) draw();
  };
}

/* ---------- 4. SHARE LOCATION PAGE (WITH EXCLUSIVITY LOCK) ---------- */
async function share(routeId = routeVersion) {
  app.innerHTML = '<main><h2>Share Bus Location</h2><p class="muted">Loading share options…</p></main>';
  await loadBuses();
  if (!isCurrentRoute(routeId)) return;
  const searchParams = new URLSearchParams(location.hash.includes('?') ? location.hash.split('?')[1] : '');
  const preselectId = searchParams.get('bus') || (buses[0] ? buses[0].id : '');
  let lastDrawKey = null;

  const drawShare = () => {
    const selEl = document.getElementById('sel');
    const curBusId = selEl ? selEl.value : (preselectId || (buses[0] ? buses[0].id : ''));
    const curBus = buses.find(b => b.id == curBusId);
    const lock = curBusId ? isBusLockedByOther(curBusId) : false;
    const lockSignature = buses.filter(b => b.is_active)
      .map(b => `${b.id}:${isBusLockedByOther(b.id) ? '1' : '0'}`).join(',');
    const drawKey = sharing
      ? `sharing:${sharing.id}:${sharing.demo}`
      : `selection:${curBusId}:${lockSignature}`;

    if (drawKey === lastDrawKey) {
      if (!sharing && lock) {
        const ageEl = document.getElementById('lock-age');
        if (ageEl) ageEl.textContent = `${lock.ageSec}s`;
      }
      return;
    }
    lastDrawKey = drawKey;

    // If currently broadcasting
    if (sharing) {
      app.innerHTML = `
        <main>
          <h2>Share Your Bus Location</h2>
          <div class="card" style="border: 2px solid #16a34a; background: #FAFDFB;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
              <b style="color:#16a34a;font-size:1.15rem;">
                <span class="pulse-dot" style="margin-right:6px"></span>
                ${sharing.demo ? '🟣 SIMULATION ACTIVE (DEMO)' : '🟢 LIVE LOCATION BROADCAST ACTIVE'}
              </b>
              <span class="badge live">YOU ARE BROADCASTING</span>
            </div>
            <p style="margin-top:10px;font-size:1.05rem;">Bus: <b>${esc(sharing.name)}</b></p>
            <p class="muted">${esc(sharing.routeName)}</p>
            <div class="grid-2">
              <div class="stat-box">
                <small>Latitude</small>
                <b id="la">${sharing.lastLat ? sharing.lastLat.toFixed(6) : 'waiting GPS…'}</b>
              </div>
              <div class="stat-box">
                <small>Longitude</small>
                <b id="lo">${sharing.lastLng ? sharing.lastLng.toFixed(6) : 'waiting GPS…'}</b>
              </div>
              <div class="stat-box">
                <small>Accuracy</small>
                <b id="ac">—</b>
              </div>
              <div class="stat-box">
                <small>Speed</small>
                <b id="sp">—</b>
              </div>
            </div>
            <p class="muted" id="ls" style="margin-top:12px;">Last updated: just now</p>
            <div class="card-avail" style="margin-top:12px;padding:12px;">
              <p style="font-size:0.86rem;color:#166534;margin:0;">
                🔒 <b>Exclusive Lock Active:</b> Other users are blocked from broadcasting this bus while you are sharing. Everyone tracking this bus sees your movement live on the map.
              </p>
            </div>
            <button class="btn d" style="width:100%;margin-top:14px;font-size:1rem;" id="stop">⛔ Stop Sharing Location</button>
            <a class="btn" style="width:100%;margin-top:8px;" href="#/track/${sharing.id}">📍 Open Live Map View</a>
          </div>
        </main>
      `;
      const stopBtn = document.getElementById('stop');
      if (stopBtn) stopBtn.onclick = stopShare;
      return;
    }

    // If NOT currently sharing
    app.innerHTML = `
      <main>
        <h2>Share Bus Location</h2>
        <p class="muted" style="margin-top:2px;">No login required! Anyone on the bus can share live location for everyone to track.</p>
        <div class="card">
          <label style="font-weight:700;">Select Bus</label>
          <select id="sel">
            <option value="">Choose a bus…</option>
            ${buses.filter(b => b.is_active).map(b => {
              const bLock = isBusLockedByOther(b.id);
              return `<option value="${b.id}" ${b.id == curBusId ? 'selected' : ''}>${esc(b.name)} ${bLock ? '🔒 (In Use)' : '🟢 (Available)'}</option>`;
            }).join('')}
          </select>

          ${curBus ? `
            <div style="margin-top:14px;">
              ${lock ? `
                <div class="card-locked">
                  <div style="display:flex;align-items:center;gap:10px;">
                    <span style="font-size:2rem">🔒</span>
                    <div>
                      <b style="color:var(--pink);font-size:1.05rem;display:block;">SHARING LOCKED FOR THIS BUS</b>
                      <span class="muted" style="font-size:0.85rem;">Another user is currently broadcasting live location for this bus.</span>
                    </div>
                  </div>
                  <p style="margin-top:10px;font-size:0.88rem;color:#881337;">
                    To prevent conflicting locations on the map, <b>only one person can share at a time</b>.
                    Last GPS ping received <b id="lock-age">${lock.ageSec}s</b> ago.
                  </p>
                  <a class="btn p" style="width:100%;margin-top:12px;" href="#/track/${curBus.id}">📍 Track This Bus on Live Map</a>
                  <p class="muted" style="margin-top:8px;font-size:0.78rem;text-align:center;">
                    Lock automatically releases when the current sharer stops or disconnects.
                  </p>
                </div>
                <button class="btn p" style="width:100%;margin-top:12px;" disabled title="Bus is locked by another user">Start Sharing Location (Locked)</button>
                <button class="btn" style="width:100%;margin-top:8px;" disabled title="Bus is locked by another user">Start Demo Simulation (Locked)</button>
              ` : `
                <div class="card-avail">
                  <div style="display:flex;align-items:center;gap:10px;">
                    <span style="font-size:2rem">🟢</span>
                    <div>
                      <b style="color:#16a34a;font-size:1.05rem;display:block;">BUS IS AVAILABLE TO SHARE</b>
                      <span class="muted" style="font-size:0.85rem;">No active broadcaster right now. You can start sharing.</span>
                    </div>
                  </div>
                  <p style="margin-top:8px;font-size:0.86rem;color:#166534;">
                    Click below to start broadcasting your live GPS location. All students tracking this bus will see your movement live.
                  </p>
                </div>
                <button class="btn p" style="width:100%;margin-top:14px;" id="go">📡 Start Sharing Live Location (GPS)</button>
                <button class="btn" style="width:100%;margin-top:8px;" id="demo">🟣 Start Demo (simulated route, no GPS)</button>
              `}
            </div>
          ` : ''}
        </div>
        <div id="se"></div>
        <p class="muted" style="margin-top:14px;font-size:0.85rem;">
          💡 <b>Single Sharer Rule:</b> While you are sharing, your device locks this bus so others cannot override it. When you press Stop Sharing, the bus becomes available for others again.
        </p>
      </main>
    `;

    const sel = document.getElementById('sel');
    if (sel) {
      sel.onchange = () => drawShare();
    }
    const goBtn = document.getElementById('go');
    if (goBtn) {
      goBtn.onclick = () => start(sel.value, false);
    }
    const demoBtn = document.getElementById('demo');
    if (demoBtn) {
      demoBtn.onclick = () => start(sel.value, true);
    }
  };

  drawShare();
  tick = setInterval(drawShare, 1500);
  window.onRealtimeTick = () => drawShare();
}

/* ---------- 5. ROUTER ---------- */
function route() {
  const routeId = ++routeVersion;
  activeRouteHash = location.hash;
  window.scrollTo(0, 0);
  try {
    const h = location.hash.replace('#', '') || '/';
    if (sharing && !h.startsWith('/share')) stopShare();
    cleanup();
    if (h.startsWith('/track/')) {
      const busId = h.split('/')[2];
      track(busId, routeId);
    } else if (h.startsWith('/buses')) {
      busList(routeId);
    } else if (h.startsWith('/share')) {
      share(routeId);
    } else {
      home();
    }
  } catch (e) {
    app.innerHTML = '<main><div class="err">Page error: ' + String(e.message || e).replace(/</g, '&lt;') + '</div></main>';
  }
}

window.addEventListener('hashchange', route);
window.addEventListener('offline', () => {
  const w = document.getElementById('warn');
  if (w) w.innerHTML = '<div class="warn">You are offline. Reconnect to see live updates.</div>';
});
window.addEventListener('online', () => {
  const w = document.getElementById('warn');
  if (w && !rlsWarnShown) w.innerHTML = '';
});

// Window unload: stop sharing to free up the bus lock immediately
window.addEventListener('beforeunload', () => {
  if (sharing) {
    stopShare();
  }
});

// Initialize realtime connection & clock
setupRealtime();
setInterval(() => {
  const e = document.getElementById('isc');
  if (e) e.textContent = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit', hour12: true }) + ' IST';
}, 1000);

// Load buses once at startup and render route
loadBuses().then(() => {
  route();
});
</script>
